[project]
name = "agi"
version = "0.1.0"
description = "Эволюционные миры без награды и backprop: тела, Minds с act()/spawn(), правило пластичности внутри агента"
requires-python = ">=3.12"
dependencies = [
    "arcade>=3.3.3",
    "gymnasium>=1.3.0",
    "numpy>=2.5.1",
    "pillow>=11.0",
]

[dependency-groups]
dev = ["pytest>=9.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
