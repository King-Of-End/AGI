[project]
name = "agi"
version = "0.1.0"
description = "Мир Фазы 0 по world_spec_phase01.md: событийный контракт inbox/outbox, зрительные тракты, канал истины. Зависимость одна — numpy"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
]

# Графический вид и игра человеком (--view arcade). Мир остаётся чистым
# numpy: arcade нужен только этому пути, поэтому держится отдельным экстрой.
[project.optional-dependencies]
play = ["arcade>=3.0"]

[dependency-groups]
dev = ["pytest>=9.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
